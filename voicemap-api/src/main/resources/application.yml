server.port: 8080

spring:
  application:
    name: voicemap-api
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/11111111
    username: root
    password: 111111
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

auth:
  google:
    client-id:

jwt:
  secret: secretsecretsecretsecret
  access-token-expiration: 1h
  refresh-token-expiration: 7d
---
