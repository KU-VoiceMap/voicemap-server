server.port: 8080
spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${db-url}
    username:  ${db-user}
    password:  ${db-password}

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate:
      SQL: DEBUG

voicemap:
  datasource:
    driver-class-name: # TODO: add properties
    jdbc-url:
    username:
    password:
    pool-name: voicemap-hikari-pool

spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false

voicemap:
  datasource:
    driver-class-name: # TODO: add properties
    jdbc-url:
    username:
    password:
    pool-name: voicemap-hikari-pool

auth:
  google:
    client-id:

jwt:
  secret: secretsecretsecretsecret
  access-token-expiration: 1h
  refresh-token-expiration: 7d
python:
  apikey: ${apiKey}
  script:
    resource-path: classpath:getKey.py

gemini:
  api-key:
  model: "gemini-2.5-flash"
