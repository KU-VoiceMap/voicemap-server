server.port: 8080
spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${db-url}
    username:  ${db-user}
    password:  ${db-password}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:  ${googleclient-id}
            client-secret:  ${googleclient-secret}
            scope:
              - email
app:
  jwt:
    secret-key:  ${app.jwt.secret-key}
    access-token: 1800000     # 30분 (밀리초 단위)
    refresh-token: 604800000
python:
  apikey: ${apiKey}
  script:
    resource-path: classpath:getKey.py
