server.port: 8080

spring:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate:
      SQL: DEBUG

voicemap:
  datasource:
    driver-class-name: org.h2.Driver
    jdbc-url: jdbc:h2:mem:voicemap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    pool-name: voicemap-hikari-pool


auth:
  google:
    client-id: test

jwt:
  secret-key: secretsecretsecretsecretsecretsecretsecretsecret
  access-token-expire-duration: 1h
  refresh-token-expire-duration: 7d

gemini:
  api-key: apikey
  urls:
    agent-web-socket-url: wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent
    document-api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
    chat-api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
  models:
    agent-model: models/gemini-2.5-flash-native-audio-preview-12-2025
    document-model: gemini-2.5-flash
    chat-model: gemini-2.5-flash
  instructions:
    agent: you are kind.
    document: you are kind.
    chat: you are kind.
---

spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false

voicemap:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    jdbc-url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool-name: voicemap-hikari-pool

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expire-duration: 1h
  refresh-token-expire-duration: 7d

gemini:
  api-key: ${GEMINI_API_KEY}
  urls:
    agent-web-socket-url: ${GEMINI_AGENT_WEB_SOCKET_URL}
    document-api-url: ${GEMINI_DOCUMENT_API_URL}
    chat-api-url: ${GEMINI_CHAT_API_URL}
  models:
    agent-model: ${GEMINI_AGENT_MODEL}
    document-model: ${GEMINI_DOCUMENT_MODEL}
    chat-model: ${GEMINI_CHAT_MODEL}
  instructions:
    agent: ${GEMINI_INSTRUCTION_AGENT}
    document: ${GEMINI_INSTRUCTION_DOCUMENT}
    chat: ${GEMINI_INSTRUCTION_CHAT}
