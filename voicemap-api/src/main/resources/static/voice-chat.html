<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMap</title>
    <link rel="stylesheet" href="/voice-chat.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <main class="page">
        <section class="auth-view" id="authView" hidden>
            <div class="auth-card">
                <h1>VoiceMap</h1>
                <div id="googleSignInButton" class="google-signin-slot"></div>
                <p id="authStatus" class="auth-status" hidden></p>
            </div>
        </section>

        <section class="app-view" id="appView" hidden>
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>VoiceMap</h2>
                    <p id="memberInfo" class="member-info">-</p>
                </div>

                <div class="sidebar-controls">
                    <button id="newSessionBtn" class="btn btn-tertiary">새 대화</button>
                    <button id="logoutBtn" class="btn btn-ghost">로그아웃</button>
                </div>

                <div class="chat-list-wrap">
                    <h3>채팅 목록</h3>
                    <ul id="chatList" class="chat-list"></ul>
                </div>
            </aside>

            <section class="main-panel">
                <header class="main-header">
                    <div>
                        <h3 id="chatTitle">대화를 선택하거나 새 대화를 시작하세요.</h3>
                        <p id="connectionState" class="connection-state">연결 안됨</p>
                    </div>
                    <div class="status-group">
                        <span id="sessionIdBadge" class="badge">session: -</span>
                        <span id="micStatusBadge" class="badge">mic: idle</span>
                        <span id="aiStatusBadge" class="badge">ai: idle</span>
                    </div>
                </header>

                <div id="transcriptPanel" class="transcript-panel">
                    <div class="empty-state">
                        <p>기존 대화가 여기에 표시됩니다.</p>
                    </div>
                </div>

                <footer class="recorder-footer">
                    <button id="recordBtn" class="btn btn-primary">녹음 시작</button>
                    <p class="footer-hint">텍스트 입력 없이 녹음 버튼으로만 WebSocket 음성 세션을 진행합니다.</p>
                </footer>
            </section>
        </section>
    </main>
    <script src="/voice-chat.js"></script>
</body>
</html>
