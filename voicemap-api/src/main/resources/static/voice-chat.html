<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat</title>
    <link rel="stylesheet" href="voice-chat.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Voice Chat with AI</h1>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">연결 안됨</span>
            </div>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <p>👋 안녕하세요! 연결 버튼을 눌러 대화를 시작하세요.</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn btn-primary">
                <span class="btn-icon">🔌</span>
                연결
            </button>
            <button id="disconnectBtn" class="btn btn-secondary" disabled>
                <span class="btn-icon">🔌</span>
                연결 종료
            </button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">세션 ID:</span>
                <span class="info-value" id="sessionId">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">마이크 상태:</span>
                <span class="info-value" id="micStatus">대기 중</span>
            </div>
            <div class="info-item">
                <span class="info-label">AI 상태:</span>
                <span class="info-value" id="aiStatus">대기 중</span>
            </div>
        </div>
    </div>

    <script src="voice-chat.js"></script>
</body>
</html>
