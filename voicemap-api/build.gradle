plugins {
    id 'com.epages.restdocs-api-spec' version '0.18.2'
}

dependencies {
    // AI
    implementation project(':voicemap-ai-core')
    runtimeOnly project(':voicemap-ai-gemini')

    // API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Auth
    implementation 'com.auth0:java-jwt:4.5.0'
    implementation 'com.google.api-client:google-api-client:2.0.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.42.0'

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc17:23.26.0.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // RestDocs
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.18.2'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'io.rest-assured:spring-mock-mvc'
    testImplementation 'io.rest-assured:rest-assured'

    // ArchUnit
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.bootJar {
    enabled = true
    mainClass = 'org.ku.voicemap.VoiceMapApiApplication'
}

openapi3 {
    servers = [
            {
                url = "http://localhost:8080"
                description = "로컬"
            }
    ]
    title = "VoiceMap API Documentation"
    description = "VoiceMap API 문서"
    format = "yaml"
}
